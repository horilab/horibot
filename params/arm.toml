# 팔의 설계 값 (명목값). 재서 얻은 값은 data/measured.toml에 따로 둔다 (docs/decisions/0006).
# 단위는 키 이름에 붙인다. 코드는 읽을 때 SI로 바꾼다 (docs/conventions.md).
# 읽는 코드: packages/design/src/horibot_design/values.py

# UR형 6축 (0013). 영점 자세에서 팔은 위로 곧게 서고, 모든 링크 좌표계가 베이스와 같은 방향이다.
# J1은 z축, J2·J3·J4는 y축, J5는 영점에서 z축, J6는 y축으로 돈다.
# 길이와 범위는 골격 결정(0017)에서 정했다. 손목 오프셋은 UR식 외형(0019)에 맞춰 늘렸다.
[arm]
shoulder_height_mm = 160 # 설치면 → J2 축
upper_arm_mm = 220 # J2 축 → J3 축
forearm_mm = 180 # J3 축 → J4 축
j4_to_j5_mm = 63 # J4 축 방향
j5_to_j6_mm = 63 # J5 축 방향
j6_to_flange_mm = 50 # J6 축 방향

# 관절마다 서보(0011)와 범위. 범위는 영점 자세 기준이고 서보 한 바퀴(360°) 안이다.
# J2 ~ J4는 UR식 관절(0028, 0029)의 프로그램 한계다: 기계 멈춤이 범위 가운데에서 양쪽 163°, 한계는 160°. 자식이 출력
# 원판 위에 앉아 옆으로 비켜서 팔꿈치도 끝까지 접힌다 (쉬는 자세 J3 154°, 0037). J1, J5, J6는 아직 옛 골격(0017)의
# 값이고, 손목 끝 값을 옮길 때 바꾼다.
[joints.j1]
servo = "STS3215"
range_deg = [-175, 175] # 케이블 경로를 정할 때 다시 본다

[joints.j2]
servo = "ST-3120"
range_deg = [-160, 160]

[joints.j3]
servo = "STS3250"
range_deg = [-160, 160]

[joints.j4]
servo = "STS3215"
range_deg = [20, 340] # 범위 가운데가 180°다 (손목 1을 J4 원판에 반 바퀴 돌려 단다, 0029)

[joints.j5]
servo = "STS3215"
range_deg = [-15, 140]

[joints.j6]
servo = "STS3215"
range_deg = [-95, 115]
