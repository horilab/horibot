# 팔의 설계 값 (명목값). 재서 얻은 값은 data/measured.toml에 따로 둔다 (docs/decisions/0006).
# 단위는 키 이름에 붙인다. 코드는 읽을 때 SI로 바꾼다 (docs/conventions.md).
# 읽는 코드: packages/design/src/horibot_design/values.py

# UR형 6축 (0013). 영점 자세에서 팔은 위로 곧게 서고, 모든 링크 좌표계가 베이스와 같은 방향이다.
# J1은 z축, J2·J3·J4는 y축, J5는 영점에서 z축, J6는 y축으로 돈다.
# 링크 길이는 골격 결정(0017)에서 정했다. 손목 오프셋은 UR식 관절 부품의 쌓임에서 나온 값이다 (0029: 자식이 출력 원판
# 위에 앉아 관절마다 옆으로 한 칸씩 비킨다). 부품 코드의 쌓임(horibot_design.placement)과 같은지는
# packages/design/tests/test_placement.py가 본다.
[arm]
shoulder_height_mm = 160 # 설치면 → J2 축
upper_arm_mm = 220 # J2 축 → J3 축
forearm_mm = 180 # J3 축 → J4 축
j4_to_j5_mm = 79.21 # J4 축 방향: J1 축을 품은 면에서 J5 축까지 (J2 ~ J4가 나란해서 옆 오프셋이 다 모인다)
j5_to_j6_mm = 70.31 # J5 축 방향
j6_to_flange_mm = 32.6 # J6 축 방향: 플랜지 면은 J6 출력 원판의 윗면이다

# 관절마다 서보(0011)와 범위. 범위는 영점 자세 기준이고 서보 한 바퀴(360°) 안이다.
# 범위는 모두 UR식 관절(0028, 0029)의 프로그램 한계다: 기계 멈춤이 범위 가운데에서 양쪽 163°, 한계는 160°. 자식이 출력
# 원판 위에 앉아 옆으로 비켜서 팔꿈치도 깊이 접힌다 (쉬는 자세 J3 154°, 0037).
[joints.j1]
servo = "STS3215"
range_deg = [-160, 160]

[joints.j2]
servo = "ST-3120"
range_deg = [-160, 160]

[joints.j3]
servo = "STS3250"
range_deg = [-160, 160]

[joints.j4]
servo = "STS3215"
range_deg = [20, 340] # 범위 가운데가 180°다 (손목 1을 J4 원판에 반 바퀴 돌려 단다, 0029)

[joints.j5]
servo = "STS3215"
range_deg = [-160, 160]

[joints.j6]
servo = "STS3215"
range_deg = [-160, 160]
