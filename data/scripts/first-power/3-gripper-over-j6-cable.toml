# 처음 전원 3: 그리퍼 몸통이 J6 선 위로 내려오는 자세 (docs/decisions/0031의 D405 선 "안 될 때", 0034의 처음 전원 순서)
# J5가 -151° ~ -163°이고 J6이 +11° ~ +23°이면 J6과 같이 도는 그리퍼 몸통이 손목 1의 살 쪽으로 내려와, 거기를 지나는
# J6 서보 선을 누를 수 있다. 부딪힘 검사의 형상에서는 J5 -154°(J6 17°)에서 그리퍼 몸통과 손목 1 몸통 사이가 3.4 mm다
# (선은 형상에 없다). 선이 눌리는지 보려고 J6을 17°에 두고 J5를 -160°까지 천천히(속도 20%) 간다.
# 그리퍼 몸통이 선에 닿기 시작하면 Enter를 눌러 세운다 (순서가 끝나고 팔은 그 자리에서 버틴다. J5 토크 한도는 20%다).
name = "그리퍼 몸통과 J6 선"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 20
start = "rest"

[[steps]]
move = "rest_above"
[[steps]]
move = { j1 = 0.0, j2 = 0.0, j3 = 0.0, j4 = 270.0, j5 = 0.0, j6 = 17.0 } # J4 90°면 J5 -144°에서 그리퍼가 아래팔에 닿는다
[[steps]]
move = { j5 = -140.0 }
[[steps]]
pause = "그리퍼 몸통과 J6 선이 보이는 자리에 섰으면 (다음은 J5 -150°)"
[[steps]]
move = { j5 = -150.0 }
[[steps]]
pause = "다음은 J5 -160°까지 천천히 간다. 몸통이 선에 닿기 시작하면 Enter로 세운다"
[[steps]]
move = { j5 = -160.0 }
[[steps]]
pause = "선이 눌렸는지 가까이서 사진을 찍었으면"
[[steps]]
move = { j5 = -140.0 }
[[steps]]
move = { j5 = 0.0, j6 = 0.0 }
[[steps]]
move = "home"
[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
