# 처음 전원 3: 홈 자세 사진 (docs/decisions/0019, 0034의 처음 전원 순서)
# 홈 자세(H3)에서 위팔의 BOMI와 아래팔의 HORI가 사진 한 장에 다 보이는지 본다. 사진은 책상 앞에서 볼 때 왼쪽 옆
# (로봇의 오른쪽)에서 0.6 ~ 1.2 m 떨어져 찍는다. 관절 밖 고리(D405 선, J2·J3 서보 선)는 찍기 전에 손으로 글자 밖으로
# 비켜 놓는다.
name = "홈 자세 사진"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 50
start = "rest"

[[steps]]
move = "rest_above"
[[steps]]
move = "home"
[[steps]]
pause = "고리를 글자 밖으로 비켜 놓고 로봇 오른쪽에서 사진을 찍었으면"
[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
