# 처음 전원 2: 관절 하나씩 끝까지 돌리기 (docs/decisions/0031의 D405 선, 0034의 처음 전원 순서)
# D405 선을 찍찍이 타이로 묶은 뒤, 관절을 하나씩 양 끝까지 돌리며 관절 밖 고리(J1·J2, J3, J4·J5)와 서보 선이
# 당기거나 끼지 않는지 본다. 끝마다 멈춘다. J1, J4, J5, J6은 소프트 한계(±160°, J4는 20° ~ 340°, J5는 -145° ~ 160°)까지 가고, J2와 J3은
# 책상과 팔 자신이 막아 한계까지 못 가서 부딪힘 검사의 형상에서 10 mm 넘게 남는 곳까지 간다 (J2 -115° ~ 70°,
# J3 -135° ~ 160°). J5는 J6을 90°에 두고 돈다: J6이 0° 둘레면 그리퍼 몸통이 손목 1에 닿는다.
# 준비: 팔 둘레 60 cm 안의 책상 위를 비운다 (J2를 돌릴 때 팔이 로봇 오른쪽과 왼쪽으로 눕는다).
# 움직이는 동안 선이 걸리면 Enter를 눌러 세운다 (순서가 끝나고 팔은 그 자리에서 버틴다). 처음 도는 날이라 실행 루프
# 한계의 25%(관절 7.5°/s)로 천천히 가서, 걸릴 때 세울 틈을 넉넉히 둔다.
name = "관절 하나씩 끝까지"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 25
start = "rest"

[[steps]]
move = "rest_above"

# J2: 팔을 로봇 오른쪽으로 돌리고 아래팔을 직각으로 접어 위팔을 양쪽으로 눕힌다
[[steps]]
move = { j1 = -90.0, j2 = 0.0, j3 = 90.0, j4 = 180.0, j5 = 0.0, j6 = 0.0 }
[[steps]]
move = { j2 = -115.0 }
[[steps]]
pause = "J2 -115°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j2 = 70.0 }
[[steps]]
pause = "J2 70°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j2 = 0.0 }

# J3: 위팔을 세우고 아래팔을 양쪽 끝까지
[[steps]]
move = { j3 = 0.0, j4 = 270.0, j5 = -90.0 }
[[steps]]
move = { j3 = -135.0 }
[[steps]]
pause = "J3 -135°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j3 = 160.0 }
[[steps]]
pause = "J3 160°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j3 = 0.0 }

# J1: 팔을 곧게 세워 돌린다 (벽까지 60 mm 넘게 남는다)
[[steps]]
move = { j1 = 0.0 }
[[steps]]
move = { j1 = -160.0 }
[[steps]]
pause = "J1 -160°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j1 = 160.0 }
[[steps]]
pause = "J1 160°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j1 = 0.0 }

# J4
[[steps]]
move = { j4 = 180.0, j5 = 0.0 }
[[steps]]
move = { j4 = 20.0 }
[[steps]]
pause = "J4 20°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j4 = 340.0 }
[[steps]]
pause = "J4 340°: 선이 당기거나 끼지 않는지 봤으면"

# J5: J6을 90°에 둔다
[[steps]]
move = { j4 = 90.0, j6 = 90.0 }
[[steps]]
move = { j5 = -145.0 }
[[steps]]
pause = "J5 -145°: 선이 당기거나 끼지 않는지 봤으면 (D405 선이 J5 멈춤 귀 둘레 틈에 끼었던 쪽이다)"
[[steps]]
move = { j5 = 160.0 }
[[steps]]
pause = "J5 160°: 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j5 = 90.0 }

# J6
[[steps]]
move = { j6 = -160.0 }
[[steps]]
pause = "J6 -160°: 그리퍼 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j6 = 160.0 }
[[steps]]
pause = "J6 160°: 그리퍼 선이 당기거나 끼지 않는지 봤으면"
[[steps]]
move = { j6 = 0.0 }

[[steps]]
move = "home"
[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
