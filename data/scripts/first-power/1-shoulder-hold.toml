# 처음 전원 1: 어깨 버티기 (docs/decisions/0028의 시험과 측정, 0034의 처음 전원 순서)
# 평행 그리퍼에 짐 150 g을 쥐고, 덜 힘든 자세부터 주 작업 영역의 가장 힘든 자세(반지름 30 cm)까지 팔을 펴 가며
# 버틴다. 자세는 도구가 아래를 보는 작업 갈래(앞위+)의 해다: 로봇 앞 오른쪽 대각선(방위 -45°), 도구 끝 높이 18 cm,
# 반지름 16 → 20 → 24 → 26 → 28 → 30 cm. 설계로 본 J2 부담은 정격의 0.38 → 0.50 → 0.62 → 0.67 → 0.73 → 0.78배다.
# 자세마다 30초 버티며 버틸 수 있는지(부하가 실행 루프의 상한 안), 처진 양, 부하가 설계 셈과 맞는지 본다. 한계를 찾는
# 시험이 아니라서 온도는 오래 버텨 보지 않고, 평소에 쓰며 기록으로 본다 (0028). 서보가 온도 알림 기준(45 °C)에 닿으면
# 남은 자세를 건너뛰고 홈 자세로 돌아가(hot_return) 짐을 빼고 쉬는 자세로 간다.
# 기록(records/run/)에 관절마다 목표와 읽은 각, 부하, 온도가 박자마다 남는다: 자세마다 J2가 처진 양도 여기서 읽는다.
# 준비: 팔 밑(앞 오른쪽)에 쿠션, 짐 150 g. 움직이거나 버티는 동안 Enter를 누르면 감속해 서고 순서를 끝낸다.
name = "어깨 버티기"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 50
start = "rest"

[[steps]]
move = "rest_above" # 쉬는 자세는 J2만 세워 떠난다 (0037)
[[steps]]
move = "home" # 짐을 쥐여 주는 자세: 도구가 아래를 본다
[[steps]]
grip = 50
[[steps]]
pause = "짐(150 g)을 손가락 사이에 대고 받쳤으면"
[[steps]]
grip = 0 # 짐에 막혀 서면 잡은 것이다
[[steps]]
pause = "짐을 쥐었고 쿠션이 팔 밑(앞 오른쪽)에 있으면 손을 떼고"

[[steps]]
move = { j1 = -74.67, j2 = 11.68, j3 = 102.05, j4 = 156.27, j5 = 90.0, j6 = -29.67 } # 반지름 16 cm
[[steps]]
hold_s = 30
[[steps]]
move = { j1 = -68.33, j2 = 22.54, j3 = 87.0, j4 = 160.46, j5 = 90.0, j6 = -23.33 } # 20 cm
[[steps]]
hold_s = 30
[[steps]]
move = { j1 = -64.27, j2 = 33.51, j3 = 69.47, j4 = 167.02, j5 = 90.0, j6 = -19.27 } # 24 cm
[[steps]]
hold_s = 30
[[steps]]
move = { j1 = -62.74, j2 = 39.5, j3 = 59.04, j4 = 171.45, j5 = 90.0, j6 = -17.74 } # 26 cm
[[steps]]
hold_s = 30
[[steps]]
move = { j1 = -61.43, j2 = 46.32, j3 = 46.53, j4 = 177.15, j5 = 90.0, j6 = -16.43 } # 28 cm
[[steps]]
hold_s = 30
[[steps]]
move = { j1 = -60.31, j2 = 55.13, j3 = 29.39, j4 = 185.49, j5 = 90.0, j6 = -15.31 } # 30 cm: 가장 힘든 자세
[[steps]]
hold_s = 30

[[steps]]
move = "home"
hot_return = true # 뜨거우면 남은 자세를 건너뛰고 여기로 와서 짐을 빼고 쉬는 자세로 간다
[[steps]]
pause = "짐을 받칠 준비가 됐으면 (다음에 그리퍼를 연다)"
[[steps]]
grip = 50
[[steps]]
pause = "짐을 뺐으면"
[[steps]]
grip = 0
[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
