# 홈 자세를 거쳐 쉬는 자세로 돌아가기 (docs/decisions/0034, 0037, 0042): 떨림·처짐 재기(tuning/)처럼 홈 자세 둘레에서
# 세운 뒤에 쓴다. 손목을 홈 자세보다 더 돌린 자리(J4 165°, J5 110°)에서 쉬는 자세 위로 곧게 가면(to-rest.toml) 그리퍼가
# 위팔을 스친다. 쉬는 자세 바로 둘레(쉬는 자세 위보다 아래)에서는 이 순서가 막혀서(홈 자세로 곧게 가면 아래팔이 선반을
# 긁는다) to-rest.toml을 쓴다. 실행 명령이 지금 팔 자세에서 세 이동을 부딪힘 검사로 거르니, --yes 없이 먼저 돌려 지나는
# 쪽을 고른다. 그리퍼가 짐을 쥐고 있으면 먼저 뺀다 (짐은 부딪힘 검사의 형상에 없다).
name = "홈 자세를 거쳐 쉬는 자세로"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 50

[[steps]]
move = "home"
[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
