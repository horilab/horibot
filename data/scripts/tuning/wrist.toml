# 떨림·처짐 재기 2: J4 ~ J6 왕복 (docs/decisions/0042의 재는 법)
# 손목은 J1 ~ J3에서 고른 설정으로 이 순서를 한 번 돌려 확인만 한다. 왕복은 J1 ~ J3과 같다: 홈 자세 둘레에서 관절
# 하나씩 ±20°를 7.5°/s(실행 루프 한계의 25%)와 15°/s(50%)로 오가고, 끝마다 5초 버틴다. 짐은 없다. 기록은
# tools/run_metrics.py로 본다. 2분 30초쯤 걸린다.
# 준비: 팔 둘레 60 cm 안의 책상 위를 비운다. 움직이거나 버티는 동안 B(Enter)를 누르면 그 자리에 서고 순서를 끝낸다.
# 버틸 때 팔이 흔들리면(헌팅) 바로 B를 누른다: 순서가 끝나며 시험 값을 처음 값으로 되돌린다.
name = "떨림·처짐 재기: J4 ~ J6"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 50
start = "rest"

[[steps]]
move = "rest_above" # 쉬는 자세는 J2만 세워 떠난다 (0037)
[[steps]]
move = "home"

# J4 (홈 145°): 7.5°/s
[[steps]]
move = { j4 = 165.0 }
speed_percent = 25
[[steps]]
hold_s = 5
[[steps]]
move = { j4 = 125.0 }
speed_percent = 25
[[steps]]
hold_s = 5
[[steps]]
move = { j4 = 145.0 }
speed_percent = 25
# J4: 15°/s
[[steps]]
move = { j4 = 165.0 }
speed_percent = 50
[[steps]]
hold_s = 5
[[steps]]
move = { j4 = 125.0 }
speed_percent = 50
[[steps]]
hold_s = 5
[[steps]]
move = { j4 = 145.0 }
speed_percent = 50

# J5 (홈 90°): 7.5°/s
[[steps]]
move = { j5 = 110.0 }
speed_percent = 25
[[steps]]
hold_s = 5
[[steps]]
move = { j5 = 70.0 }
speed_percent = 25
[[steps]]
hold_s = 5
[[steps]]
move = { j5 = 90.0 }
speed_percent = 25
# J5: 15°/s
[[steps]]
move = { j5 = 110.0 }
speed_percent = 50
[[steps]]
hold_s = 5
[[steps]]
move = { j5 = 70.0 }
speed_percent = 50
[[steps]]
hold_s = 5
[[steps]]
move = { j5 = 90.0 }
speed_percent = 50

# J6 (홈 0°): 7.5°/s
[[steps]]
move = { j6 = 20.0 }
speed_percent = 25
[[steps]]
hold_s = 5
[[steps]]
move = { j6 = -20.0 }
speed_percent = 25
[[steps]]
hold_s = 5
[[steps]]
move = { j6 = 0.0 }
speed_percent = 25
# J6: 15°/s
[[steps]]
move = { j6 = 20.0 }
speed_percent = 50
[[steps]]
hold_s = 5
[[steps]]
move = { j6 = -20.0 }
speed_percent = 50
[[steps]]
hold_s = 5
[[steps]]
move = { j6 = 0.0 }
speed_percent = 50

[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
