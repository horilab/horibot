# 쉬는 자세로 돌아가기 (docs/decisions/0034, 0037): 순서를 중간에 세운 뒤처럼 팔이 어디에 있든 쉬는 자세 위를 거쳐
# 선반에 앉히고 토크를 끈다. 시작 자세가 없어서, 실행 명령이 지금 팔 자세에서 두 이동을 부딪힘 검사로 거른다. 막히면
# 그 자리에 맞는 길을 따로 짠다. 그리퍼가 짐을 쥐고 있으면 먼저 뺀다 (짐은 부딪힘 검사의 형상에 없다).
name = "쉬는 자세로"
joints = ["j1", "j2", "j3", "j4", "j5", "j6"]
speed_percent = 50

[[steps]]
move = "rest_above"
[[steps]]
move = "rest"
[[steps]]
pause = "아래팔이 선반에 앉았으면 (다음에 토크를 끈다)"
[[steps]]
release = true
